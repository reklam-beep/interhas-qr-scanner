<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Interhas QR Giriş</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #0513ab;
      color: white;
      text-align: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      padding: 8px 12px;
      box-sizing: border-box;
    }

    h1 {
      font-size: clamp(25px, 4.2vw, 44px);
      margin: 6px 0 2px;
      font-weight: bold;
      line-height: 1.08;
    }

    #durum {
      font-size: clamp(16px, 2.6vw, 24px);
      margin-bottom: 5px;
      min-height: 24px;
    }

    button {
      width: 100%;
      max-width: 700px;
      min-height: 46px;
      margin: 5px auto;
      display: block;
      font-size: clamp(18px, 3vw, 27px);
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: white;
      color: #0b4f7a;
      cursor: pointer;
    }

    .kapat {
      background: #b00020;
      color: white;
    }

    .yesilBtn {
      background: #168a3a;
      color: white;
    }

    .kirmiziBtn {
      background: #b00020;
      color: white;
    }

    input {
      width: 100%;
      max-width: 700px;
      height: 46px;
      font-size: clamp(18px, 3vw, 25px);
      padding: 7px 12px;
      border-radius: 11px;
      border: none;
      box-sizing: border-box;
      margin: 5px auto;
      display: block;
    }

    #reader {
      width: 100%;
      max-width: min(700px, 74vh);
      margin: 8px auto 0;
      background: white;
      padding: 7px;
      border-radius: 16px;
      color: #111;
      box-sizing: border-box;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      border-radius: 11px;
    }

    #reader__dashboard {
      display: none !important;
    }

    .gizli {
      display: none !important;
    }

    .panelBolum {
      max-width: 700px;
      margin: 10px auto 0;
      padding: 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.16);
      box-sizing: border-box;
    }

    .bolumBaslik {
      font-size: clamp(22px, 4vw, 34px);
      font-weight: bold;
      margin-bottom: 8px;
    }

    .sonucKart {
      background: white;
      color: #111;
      padding: 14px;
      margin: 10px 0;
      border-radius: 14px;
      text-align: left;
      font-size: clamp(19px, 3vw, 28px);
      line-height: 1.35;
    }

    .sonucKart button {
      max-width: 100%;
      min-height: 50px;
      font-size: clamp(18px, 3vw, 26px);
      margin-top: 12px;
    }

    .statGrid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .statBox {
      background: #0b4f7a;
      color: white;
      border-radius: 14px;
      padding: 18px 10px;
      text-align: center;
    }

    .statNumber {
      font-size: clamp(34px, 6vw, 54px);
      font-weight: bold;
      line-height: 1;
    }

    .statLabel {
      font-size: clamp(16px, 3vw, 24px);
      margin-top: 8px;
    }

    .statGreen {
      background: #148f3c;
    }

    .statRed {
      background: #b00020;
    }

    .statOrange {
      background: #d98c00;
    }

    #mesaj {
      max-width: 900px;
      margin: 18px auto;
      padding: 22px 16px;
      border-radius: 20px;
      font-size: 28px;
      font-weight: bold;
      line-height: 1.3;
      display: none;
    }

    .popupOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 24px;
      box-sizing: border-box;
    }

    .popupBox {
      width: 100%;
      max-width: 760px;
      color: white;
      border-radius: 28px;
      padding: 42px 28px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .popupMavi {
      background: #0b4f7a;
    }

    .popupYesil {
      background: #148f3c;
    }

    .popupKirmizi {
      background: #b00020;
    }

    .popupIcon {
      font-size: 90px;
      margin-bottom: 18px;
    }

    .popupTitle {
      font-size: clamp(34px, 7vw, 58px);
      font-weight: bold;
      margin-bottom: 22px;
    }

    .popupText {
      font-size: clamp(24px, 5vw, 40px);
      font-weight: bold;
      line-height: 1.35;
    }

    .popupSub {
      font-size: clamp(20px, 4vw, 32px);
      margin-top: 18px;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.92);
    }

    .popupLoading {
      width: 70px;
      height: 70px;
      border: 9px solid rgba(255,255,255,0.35);
      border-top: 9px solid white;
      border-radius: 50%;
      margin: 0 auto 24px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (orientation: landscape) {
      .container {
        padding: 6px 10px;
      }

      .headerLogo {
  display: block;
  margin: 8px auto 10px auto;
  max-width: min(260px, 70vw);
  width: 100%;
  height: auto;
}

h1 {
  font-size: clamp(28px, 4.5vw, 46px);
  margin: 4px 0 4px;
  font-weight: bold;
  line-height: 1.08;
  text-align: center;
}

      #durum {
        font-size: clamp(15px, 2.3vw, 22px);
        margin-bottom: 4px;
      }

      button {
        max-width: 660px;
        min-height: 42px;
        margin: 4px auto;
        font-size: clamp(17px, 2.5vw, 24px);
      }

      input {
        max-width: 660px;
        height: 42px;
        margin: 4px auto;
        font-size: clamp(17px, 2.5vw, 23px);
      }

      #reader {
        max-width: min(660px, 70vh);
        margin-top: 6px;
        padding: 6px;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <img
  class="headerLogo"
  src="https://static.wixstatic.com/media/7fdf4a_5f2e14ac02564e14acfa932d85ad025d~mv2.png/v1/fill/w_523,h_132,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Logo-01.png"
  alt="Interhas Logo"
>

<h1>HOŞGELDİNİZ</h1>
<div id="durum">Hazır</div>

  <button id="btnOnKamera" type="button">📷 ÖN KAMERA İLE QR OKUT</button>
  <button id="btnArkaKamera" type="button">📷 ARKA KAMERA İLE QR OKUT</button>
  <button id="btnKapat" type="button" class="kapat gizli">⛔ KAMERAYI KAPAT</button>

  <button id="btnIsimAra" type="button">🔎 İSİM İLE ARA</button>
  <button id="btnKlinikAra" type="button">🏥 KLİNİK İLE ARA</button>
  <button id="btnDashboard" type="button">📊 DASHBOARD</button>

  <div id="reader" class="gizli"></div>

  <div id="aramaAlan" class="panelBolum gizli">
    <div id="aramaBaslik" class="bolumBaslik">Arama</div>
    <input id="aramaInput" placeholder="Arama yazın">
    <button id="btnAra" type="button" class="yesilBtn">ARA</button>
    <div id="aramaSonuclari"></div>
  </div>

  <div id="dashboardAlan" class="panelBolum gizli">
    <div class="bolumBaslik">Dashboard</div>
    <div id="dashboardIcerik" class="sonucKart">Veriler yükleniyor...</div>
    <button id="btnDashboardYenile" type="button" class="yesilBtn">🔄 YENİLE</button>
  </div>

  <div id="mesaj"></div>
</div>

<div id="popupOverlay" class="popupOverlay">
  <div id="popupBox" class="popupBox popupMavi">
    <div id="popupContent"></div>
  </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz3FiotRJ-EjKHg_77lCJyXZ25miLyAgL417oO_5hK3lwws82k2OFz-Wjf77lVaooUwAw/exec";

let scanner = null;
let kameraAcik = false;
let qrKilidi = false;
let sonQrId = "";
let sonQrZaman = 0;
let mesajTimer = null;
let popupTimer = null;
let audioCtx = null;
let aktifAramaTipi = "isim";
let callbackSayac = 0;

function el(id) {
  return document.getElementById(id);
}

function sesHazirla() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  } catch (e) {}
}

function bip(frekans, sure, gecikme) {
  try {
    sesHazirla();

    setTimeout(function() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.frequency.value = frekans || 1000;
      gain.gain.value = 0.35;

      osc.start();
      osc.stop(audioCtx.currentTime + (sure || 0.18));
    }, gecikme || 0);

  } catch (e) {}
}

function bipOkundu() {
  bip(950, 0.16, 0);
}

function bipBasarili() {
  bip(1100, 0.15, 0);
  bip(1100, 0.15, 230);
}

function bipHata() {
  bip(300, 0.25, 0);
}

document.addEventListener("DOMContentLoaded", function() {
  el("btnOnKamera").addEventListener("click", function() {
    kamerayiBaslat("user");
  });

  el("btnArkaKamera").addEventListener("click", function() {
    kamerayiBaslat("environment");
  });

  el("btnKapat").addEventListener("click", kamerayiKapat);

  el("btnIsimAra").addEventListener("click", function() {
    aramaAc("isim");
  });

  el("btnKlinikAra").addEventListener("click", function() {
    aramaAc("klinik");
  });

  el("btnDashboard").addEventListener("click", dashboardAc);
  el("btnDashboardYenile").addEventListener("click", dashboardVerileriniGetir);

  el("btnAra").addEventListener("click", ara);

  el("aramaInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      ara();
    }
  });
});

function popupGoster(html, renk, otomatikKapanmaMs) {
  const overlay = el("popupOverlay");
  const box = el("popupBox");
  const content = el("popupContent");

  if (popupTimer) {
    clearTimeout(popupTimer);
    popupTimer = null;
  }

  box.className = "popupBox";

  if (renk === "yesil") {
    box.classList.add("popupYesil");
  } else if (renk === "kirmizi") {
    box.classList.add("popupKirmizi");
  } else {
    box.classList.add("popupMavi");
  }

  content.innerHTML = html;
  overlay.style.display = "flex";

  if (otomatikKapanmaMs && otomatikKapanmaMs > 0) {
    popupTimer = setTimeout(function() {
      popupKapat();
    }, otomatikKapanmaMs);
  }
}

function popupKapat() {
  el("popupOverlay").style.display = "none";

  if (popupTimer) {
    clearTimeout(popupTimer);
    popupTimer = null;
  }
}

function popupYukleniyor(id) {
  popupGoster(
    '<div class="popupLoading"></div>' +
    '<div class="popupTitle">QR Kod Tarandı</div>' +
    '<div class="popupText">Giriş kontrol ediliyor...</div>' +
    '<div class="popupSub">Lütfen bekleyiniz.<br>Okunan ID: ' + escapeHtml(id) + '</div>',
    "mavi",
    0
  );
}

function jsonpApi(params, callback, hataCallback) {
  callbackSayac++;

  const callbackName = "interhasCallback_" + Date.now() + "_" + callbackSayac;

  params.callback = callbackName;
  params.t = Date.now();

  window[callbackName] = function(res) {
    try {
      callback(res);
    } finally {
      try {
        delete window[callbackName];
      } catch (e) {}

      const s = document.getElementById(callbackName);
      if (s) s.remove();
    }
  };

  const query = Object.keys(params).map(function(key) {
    return encodeURIComponent(key) + "=" + encodeURIComponent(params[key]);
  }).join("&");

  const script = document.createElement("script");
  script.id = callbackName;
  script.src = WEB_APP_URL + "?" + query;
  script.async = true;

  script.onerror = function() {
    try {
      delete window[callbackName];
    } catch (e) {}

    const s = document.getElementById(callbackName);
    if (s) s.remove();

    if (typeof hataCallback === "function") {
      hataCallback();
    } else {
      popupGoster(
        '<div class="popupIcon">❌</div>' +
        '<div class="popupTitle">Bağlantı Hatası</div>' +
        '<div class="popupText">Apps Script bağlantısı kurulamadı.</div>',
        "kirmizi",
        5000
      );
    }
  };

  document.body.appendChild(script);
}

async function kamerayiBaslat(kameraTipi) {
  sesHazirla();

  el("mesaj").style.display = "none";
  el("aramaAlan").classList.add("gizli");
  el("dashboardAlan").classList.add("gizli");

  el("durum").textContent =
    kameraTipi === "environment"
      ? "Arka kamera açılıyor..."
      : "Ön kamera açılıyor...";

  el("reader").classList.remove("gizli");
  el("btnOnKamera").classList.add("gizli");
  el("btnArkaKamera").classList.add("gizli");
  el("btnKapat").classList.remove("gizli");

  qrKilidi = false;
  sonQrId = "";
  sonQrZaman = 0;

  if (typeof Html5Qrcode === "undefined") {
    mesajGoster("❌ QR okuyucu yüklenemedi. İnternet bağlantısını kontrol edin.", "kirmizi", 6000);
    arayuzuSifirla();
    return;
  }

  const config = {
    fps: 15,
    qrbox: function(viewfinderWidth, viewfinderHeight) {
      const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
      const qrboxSize = Math.floor(minEdge * 0.78);
      return { width: qrboxSize, height: qrboxSize };
    },
    disableFlip: false
  };

  try {
    scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: kameraTipi || "user" },
      config,
      qrOkundu,
      function() {}
    );

    kameraAcik = true;

    el("durum").textContent =
      kameraTipi === "environment"
        ? "Arka kamera açık. QR kodu okutun."
        : "Ön kamera açık. QR kodu okutun.";

  } catch (err1) {
    try {
      if (scanner) await scanner.clear();
    } catch (e) {}

    try {
      scanner = new Html5Qrcode("reader");

      const yedekKameraTipi = kameraTipi === "environment" ? "user" : "environment";

      await scanner.start(
        { facingMode: yedekKameraTipi },
        config,
        qrOkundu,
        function() {}
      );

      kameraAcik = true;

      el("durum").textContent =
        yedekKameraTipi === "environment"
          ? "Arka kamera açık. QR kodu okutun."
          : "Ön kamera açık. QR kodu okutun.";

    } catch (err2) {
      try {
        await kamerayiListeyleBaslat(config);
        kameraAcik = true;
        el("durum").textContent = "Kamera açık. QR kodu okutun.";
      } catch (err3) {
        mesajGoster("❌ Kamera açılamadı.<br>Hata: " + escapeHtml(err3.message || err3), "kirmizi", 9000);
        arayuzuSifirla();
      }
    }
  }
}

async function kamerayiListeyleBaslat(config) {
  const cameras = await Html5Qrcode.getCameras();

  if (!cameras || cameras.length === 0) {
    throw new Error("Kamera bulunamadı.");
  }

  let sonHata = null;

  const siraliKameralar = cameras.slice().sort(function(a, b) {
    const aLabel = String(a.label || "").toLowerCase();
    const bLabel = String(b.label || "").toLowerCase();

    const aOn =
      aLabel.includes("front") ||
      aLabel.includes("user") ||
      aLabel.includes("selfie") ||
      aLabel.includes("ön") ||
      aLabel.includes("on");

    const bOn =
      bLabel.includes("front") ||
      bLabel.includes("user") ||
      bLabel.includes("selfie") ||
      bLabel.includes("ön") ||
      bLabel.includes("on");

    if (aOn && !bOn) return -1;
    if (!aOn && bOn) return 1;
    return 0;
  });

  for (let i = 0; i < siraliKameralar.length; i++) {
    try {
      if (scanner) {
        try {
          await scanner.clear();
        } catch (e) {}
      }

      scanner = new Html5Qrcode("reader");

      el("durum").textContent =
        "Kamera deneniyor: " + (siraliKameralar[i].label || ("Kamera " + (i + 1)));

      await scanner.start(
        siraliKameralar[i].id,
        config,
        qrOkundu,
        function() {}
      );

      return;

    } catch (err) {
      sonHata = err;
    }
  }

  throw sonHata || new Error("Hiçbir kamera açılamadı.");
}

async function kamerayiKapat() {
  try {
    if (scanner) await scanner.stop();
  } catch (e) {}

  try {
    if (scanner) await scanner.clear();
  } catch (e) {}

  scanner = null;
  kameraAcik = false;
  qrKilidi = false;

  popupKapat();
  arayuzuSifirla();
}

function arayuzuSifirla() {
  el("durum").textContent = "Hazır";
  el("reader").classList.add("gizli");
  el("btnOnKamera").classList.remove("gizli");
  el("btnArkaKamera").classList.remove("gizli");
  el("btnKapat").classList.add("gizli");
}

function qrOkundu(text) {
  if (qrKilidi) return;

  const id = qrMetnindenIdAl(text);

  if (!id) {
    qrKilidi = true;
    bipHata();

    popupGoster(
      '<div class="popupIcon">❌</div>' +
      '<div class="popupTitle">Geçersiz QR</div>' +
      '<div class="popupText">Bu QR kod sisteme uygun değil.</div>',
      "kirmizi",
      3000
    );

    setTimeout(function() {
      qrDevamEt();
    }, 3000);

    return;
  }

  const simdi = Date.now();

  if (id === sonQrId && simdi - sonQrZaman < 8000) {
    return;
  }

  sonQrId = id;
  sonQrZaman = simdi;
  qrKilidi = true;

  bipOkundu();

  try {
    if (scanner) {
      scanner.pause(true);
    }
  } catch (e) {}

  el("durum").textContent = "Okunan ID: " + id;

  popupYukleniyor(id);
  girisYapApi(id, true);
}

function qrDevamEt() {
  qrKilidi = false;

  if (!scanner || !kameraAcik) {
    el("durum").textContent = "Hazır";
    return;
  }

  el("durum").textContent = "Kamera açık. Yeni QR kodu okutun.";

  try {
    scanner.resume();
  } catch (e) {}
}

function girisYapApi(id, qrModu) {
  id = String(id || "").trim();

  if (!id) {
    bipHata();

    popupGoster(
      '<div class="popupIcon">❌</div>' +
      '<div class="popupTitle">Geçersiz ID</div>' +
      '<div class="popupText">Katılımcı ID boş.</div>',
      "kirmizi",
      3500
    );

    if (qrModu) {
      setTimeout(function() {
        qrDevamEt();
      }, 3500);
    }

    return;
  }

  let cevapGeldi = false;

  jsonpApi({
    api: "checkin",
    id: id
  }, function(res) {
    cevapGeldi = true;

    sonucYaz(res);

    if (qrModu) {
      setTimeout(function() {
        qrDevamEt();
      }, 4300);
    }
  }, function() {
    if (!cevapGeldi) {
      bipHata();

      popupGoster(
        '<div class="popupIcon">❌</div>' +
        '<div class="popupTitle">Bağlantı Hatası</div>' +
        '<div class="popupText">Apps Script bağlantısı kurulamadı.</div>' +
        '<div class="popupSub">Okunan ID: ' + escapeHtml(id) + '</div>',
        "kirmizi",
        6000
      );

      if (qrModu) {
        setTimeout(function() {
          qrDevamEt();
        }, 4300);
      }
    }
  });

  setTimeout(function() {
    if (!cevapGeldi) {
      bipHata();

      popupGoster(
        '<div class="popupIcon">⏳</div>' +
        '<div class="popupTitle">Cevap Alınamadı</div>' +
        '<div class="popupText">İşlem uzun sürdü. İnternet bağlantısını kontrol edin.</div>' +
        '<div class="popupSub">Okunan ID: ' + escapeHtml(id) + '</div>',
        "kirmizi",
        6000
      );

      if (qrModu) {
        qrDevamEt();
      }
    }
  }, 10000);
}

function sonucYaz(res) {
  if (res && res.durum === "basarili") {
    bipBasarili();

    popupGoster(
      '<div class="popupIcon">✅</div>' +
      '<div class="popupTitle">HOŞ GELDİNİZ</div>' +
      '<div class="popupText">' +
      escapeHtml(res.adSoyad || "") +
      '<br>' +
      escapeHtml(res.klinik || "") +
      '</div>' +
      '<div class="popupSub">' + escapeHtml(res.girisSaati || "") + '</div>',
      "yesil",
      4000
    );

  } else if (res && res.durum === "tekrar") {
    bipHata();

    popupGoster(
      '<div class="popupIcon">⚠️</div>' +
      '<div class="popupTitle">DAHA ÖNCE GİRİŞ YAPILDI</div>' +
      '<div class="popupText">' +
      escapeHtml(res.adSoyad || "") +
      '<br>' +
      escapeHtml(res.klinik || "") +
      '</div>' +
      '<div class="popupSub">İlk giriş: ' + escapeHtml(res.girisSaati || "") + '</div>',
      "kirmizi",
      4000
    );

  } else {
    bipHata();

    popupGoster(
      '<div class="popupIcon">❌</div>' +
      '<div class="popupTitle">Giriş Yapılamadı</div>' +
      '<div class="popupText">' +
      escapeHtml((res && res.mesaj) || "Katılımcı bulunamadı.") +
      '</div>',
      "kirmizi",
      4000
    );
  }
}

async function aramaAc(tip) {
  await kamerayiKapat();

  aktifAramaTipi = tip;

  el("dashboardAlan").classList.add("gizli");
  el("aramaAlan").classList.remove("gizli");
  el("aramaSonuclari").innerHTML = "";
  el("aramaInput").value = "";

  if (tip === "klinik") {
    el("aramaBaslik").textContent = "Klinik ile ara";
    el("aramaInput").placeholder = "Klinik adı yazın";
  } else {
    el("aramaBaslik").textContent = "İsim ile ara";
    el("aramaInput").placeholder = "Ad veya soyad yazın";
  }

  el("durum").textContent = "Arama modu açık";

  setTimeout(function() {
    el("aramaInput").focus();
  }, 200);
}

function ara() {
  const kelime = String(el("aramaInput").value || "").trim();

  if (!kelime) {
    popupGoster(
      '<div class="popupIcon">❌</div>' +
      '<div class="popupTitle">Arama Boş</div>' +
      '<div class="popupText">Arama yapmak için bir kelime yazın.</div>',
      "kirmizi",
      3000
    );
    return;
  }

  el("aramaSonuclari").innerHTML =
    '<div class="sonucKart">Aranıyor...</div>';

  jsonpApi({
    api: "search",
    tip: aktifAramaTipi,
    kelime: kelime
  }, function(res) {
    if (!res || res.durum !== "basarili") {
      el("aramaSonuclari").innerHTML =
        '<div class="sonucKart">❌ ' + escapeHtml((res && res.mesaj) || "Arama yapılamadı.") + '</div>';
      return;
    }

    aramaSonuclariniYaz(res.liste || []);
  });
}

function aramaSonuclariniYaz(liste) {
  const alan = el("aramaSonuclari");
  alan.innerHTML = "";

  if (!liste || liste.length === 0) {
    alan.innerHTML = '<div class="sonucKart">Sonuç bulunamadı.</div>';
    return;
  }

  liste.forEach(function(k) {
    const kart = document.createElement("div");
    kart.className = "sonucKart";

    const girisDurumu = String(k.girisDurumu || "").trim();
    const girisYapildi = girisDurumu === "Giriş Yaptı";

    const bilgi = document.createElement("div");
    bilgi.innerHTML =
      "<b>" + escapeHtml(k.adSoyad || "") + "</b><br>" +
      escapeHtml(k.klinik || "") + "<br>" +
      "Durum: " + escapeHtml(girisDurumu || "Henüz giriş yok");

    const btn = document.createElement("button");
    btn.type = "button";

    if (girisYapildi) {
      btn.className = "kirmiziBtn";
      btn.textContent = "GİRİŞ YAPILDI";
    } else {
      btn.className = "yesilBtn";
      btn.textContent = "GİRİŞ YAP";
    }

    btn.addEventListener("click", function() {
      bipOkundu();
      popupYukleniyor(k.id);
      girisYapApi(k.id, false);
    });

    kart.appendChild(bilgi);
    kart.appendChild(btn);
    alan.appendChild(kart);
  });
}

async function dashboardAc() {
  await kamerayiKapat();

  el("aramaAlan").classList.add("gizli");
  el("dashboardAlan").classList.remove("gizli");

  el("durum").textContent = "Dashboard açık";
  el("dashboardIcerik").innerHTML = "Veriler yükleniyor...";

  dashboardVerileriniGetir();
}

function dashboardVerileriniGetir() {
  el("dashboardIcerik").innerHTML = "Veriler yükleniyor...";

  jsonpApi({
    api: "stats"
  }, function(res) {
    if (!res || res.durum !== "basarili") {
      el("dashboardIcerik").innerHTML =
        "❌ " + escapeHtml((res && res.mesaj) || "Dashboard verisi alınamadı.");
      return;
    }

    dashboardYaz(res);
  }, function() {
    el("dashboardIcerik").innerHTML =
      "❌ Apps Script bağlantı hatası.";
  });
}

function dashboardYaz(res) {
  el("dashboardIcerik").innerHTML =
    '<div class="statGrid">' +

      '<div class="statBox">' +
        '<div class="statNumber">' + escapeHtml(res.toplam) + '</div>' +
        '<div class="statLabel">Toplam Kayıt</div>' +
      '</div>' +

      '<div class="statBox statGreen">' +
        '<div class="statNumber">' + escapeHtml(res.girisYapti) + '</div>' +
        '<div class="statLabel">Giriş Yaptı</div>' +
      '</div>' +

      '<div class="statBox statRed">' +
        '<div class="statNumber">' + escapeHtml(res.girisYapmadi) + '</div>' +
        '<div class="statLabel">Giriş Yapmadı</div>' +
      '</div>' +

      '<div class="statBox statOrange">' +
        '<div class="statNumber">%' + escapeHtml(res.oran) + '</div>' +
        '<div class="statLabel">Giriş Oranı</div>' +
      '</div>' +

      '<div class="statBox">' +
        '<div class="statNumber">' + escapeHtml(res.katiliyor) + '</div>' +
        '<div class="statLabel">Katılıyor</div>' +
      '</div>' +

      '<div class="statBox statRed">' +
        '<div class="statNumber">' + escapeHtml(res.katilmiyor) + '</div>' +
        '<div class="statLabel">Katılmıyor</div>' +
      '</div>' +

    '</div>';
}

function qrMetnindenIdAl(text) {
  text = String(text || "").trim();

  try {
    if (text.indexOf("http") === 0) {
      const url = new URL(text);
      const id = url.searchParams.get("id");

      if (id) {
        return guvenliDecode(id).trim();
      }
    }
  } catch (e) {}

  if (text.indexOf("id=") > -1) {
    return guvenliDecode(text.split("id=")[1].split("&")[0]).trim();
  }

  return guvenliDecode(text).trim();
}

function guvenliDecode(value) {
  value = String(value || "");

  try {
    return decodeURIComponent(value);
  } catch (e) {
    return value;
  }
}

function mesajGoster(html, renk, sure) {
  const m = el("mesaj");

  if (mesajTimer) {
    clearTimeout(mesajTimer);
    mesajTimer = null;
  }

  m.style.display = "block";
  m.innerHTML = html;

  const bekleme = typeof sure === "number" ? sure : 4500;

  if (bekleme > 0) {
    mesajTimer = setTimeout(function() {
      m.style.display = "none";
    }, bekleme);
  }
}

function escapeHtml(value) {
  return String(value || "").replace(/[&<>"']/g, function(s) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[s];
  });
}
