<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Interhas QR Giriş</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #0b4f7a;
      color: white;
      text-align: center;
    }

    .container {
      padding: 24px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 42px;
      margin: 20px 0 10px;
    }

    #durum {
      font-size: 26px;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      max-width: 800px;
      min-height: 72px;
      margin: 10px auto;
      display: block;
      font-size: 28px;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      background: white;
      color: #0b4f7a;
      cursor: pointer;
    }

    .kapat {
      background: #b00020;
      color: white;
    }

    #reader {
      width: 100%;
      max-width: 760px;
      margin: 20px auto;
      background: white;
      padding: 12px;
      border-radius: 18px;
      color: #111;
      box-sizing: border-box;
    }

    #mesaj {
      max-width: 900px;
      margin: 24px auto;
      padding: 28px 18px;
      border-radius: 20px;
      font-size: 32px;
      font-weight: bold;
      line-height: 1.3;
      display: none;
    }

    .yesil {
      background: #148f3c;
      color: white;
    }

    .kirmizi {
      background: #b00020;
      color: white;
    }

    .sari {
      background: #d98c00;
      color: white;
    }

    .gizli {
      display: none;
    }

    input {
      width: 100%;
      max-width: 800px;
      height: 64px;
      font-size: 28px;
      padding: 8px 14px;
      border-radius: 12px;
      border: none;
      box-sizing: border-box;
      margin-top: 18px;
    }

    .popupOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 24px;
      box-sizing: border-box;
    }

    .popupBox {
      width: 100%;
      max-width: 760px;
      background: white;
      color: #111;
      border-radius: 28px;
      padding: 42px 28px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .popupIcon {
      font-size: 90px;
      margin-bottom: 18px;
    }

    .popupTitle {
      font-size: clamp(34px, 7vw, 58px);
      font-weight: bold;
      margin-bottom: 22px;
    }

    .popupText {
      font-size: clamp(24px, 5vw, 40px);
      font-weight: bold;
      line-height: 1.35;
    }

    .popupSub {
      font-size: clamp(20px, 4vw, 32px);
      margin-top: 18px;
      line-height: 1.35;
      color: #333;
    }

    .popupLoading {
      width: 70px;
      height: 70px;
      border: 9px solid #ddd;
      border-top: 9px solid #0b4f7a;
      border-radius: 50%;
      margin: 0 auto 24px;
      animation: spin 1s linear infinite;
    }

    .popupYesil {
      border-top: 18px solid #148f3c;
    }

    .popupKirmizi {
      border-top: 18px solid #b00020;
    }

    .popupSari {
      border-top: 18px solid #d98c00;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<div class="container">
  <h1>INTERHAS ETKİNLİK GİRİŞİ</h1>
  <div id="durum">Hazır</div>

  <button id="btnBaslat" type="button">📷 ÖN KAMERA İLE QR OKUT</button>
  <button id="btnKapat" type="button" class="kapat gizli">⛔ KAMERAYI KAPAT</button>

  <input id="manuelInput" placeholder="KAT0001 veya QR linki girin">
  <button id="btnManuel" type="button">⌨️ MANUEL GİRİŞ YAP</button>

  <div id="reader" class="gizli"></div>
  <div id="mesaj"></div>
</div>

<div id="popupOverlay" class="popupOverlay">
  <div id="popupBox" class="popupBox">
    <div id="popupContent"></div>
  </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz3FiotRJ-EjKHg_77lCJyXZ25miLyAgL417oO_5hK3lwws82k2OFz-Wjf77lVaooUwAw/exec";

let scanner = null;
let kameraAcik = false;
let qrKilidi = false;
let sonQrId = "";
let sonQrZaman = 0;
let mesajTimer = null;
let popupTimer = null;
let audioCtx = null;

function el(id) {
  return document.getElementById(id);
}

/* SES FONKSİYONLARI */
function sesHazirla() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  } catch (e) {}
}

function bip(frekans, sure, gecikme) {
  try {
    sesHazirla();

    setTimeout(function() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.frequency.value = frekans || 1000;
      gain.gain.value = 0.35;

      osc.start();
      osc.stop(audioCtx.currentTime + (sure || 0.18));
    }, gecikme || 0);

  } catch (e) {}
}

function bipOkundu() {
  bip(950, 0.16, 0);
}

function bipBasarili() {
  bip(1100, 0.15, 0);
  bip(1100, 0.15, 230);
}

function bipHata() {
  bip(300, 0.25, 0);
}

/* SAYFA YÜKLENİNCE */
document.addEventListener("DOMContentLoaded", function() {
  el("btnBaslat").addEventListener("click", kamerayiBaslat);
  el("btnKapat").addEventListener("click", kamerayiKapat);
  el("btnManuel").addEventListener("click", manuelGiris);

  el("manuelInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      manuelGiris();
    }
  });
});

/* POPUP */
function popupGoster(html, renk, otomatikKapanmaMs) {
  const overlay = el("popupOverlay");
  const box = el("popupBox");
  const content = el("popupContent");

  if (popupTimer) {
    clearTimeout(popupTimer);
    popupTimer = null;
  }

  box.className = "popupBox";

  if (renk === "yesil") {
    box.classList.add("popupYesil");
  } else if (renk === "kirmizi") {
    box.classList.add("popupKirmizi");
  } else if (renk === "sari") {
    box.classList.add("popupSari");
  }

  content.innerHTML = html;
  overlay.style.display = "flex";

  if (otomatikKapanmaMs && otomatikKapanmaMs > 0) {
    popupTimer = setTimeout(function() {
      popupKapat();
    }, otomatikKapanmaMs);
  }
}

function popupKapat() {
  el("popupOverlay").style.display = "none";

  if (popupTimer) {
    clearTimeout(popupTimer);
    popupTimer = null;
  }
}

function popupYukleniyor(id) {
  popupGoster(
    '<div class="popupLoading"></div>' +
    '<div class="popupTitle">QR Kod Tarandı</div>' +
    '<div class="popupText">Giriş kontrol ediliyor...</div>' +
    '<div class="popupSub">Lütfen bekleyiniz.<br>Okunan ID: ' + escapeHtml(id) + '</div>',
    "",
    0
  );
}

/* KAMERA */
async function kamerayiBaslat() {
  sesHazirla();

  el("mesaj").style.display = "none";
  el("durum").textContent = "Ön kamera açılıyor...";
  el("reader").classList.remove("gizli");
  el("btnBaslat").classList.add("gizli");
  el("btnKapat").classList.remove("gizli");

  qrKilidi = false;
  sonQrId = "";
  sonQrZaman = 0;

  if (typeof Html5Qrcode === "undefined") {
    mesajGoster("❌ QR okuyucu yüklenemedi. İnternet bağlantısını kontrol edin.", "kirmizi", 6000);
    arayuzuSifirla();
    return;
  }

  const config = {
    fps: 10,
    qrbox: function(width, height) {
      const minEdge = Math.min(width, height);
      const size = Math.floor(minEdge * 0.72);
      return { width: size, height: size };
    },
    disableFlip: false
  };

  try {
    scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: "user" },
      config,
      qrOkundu,
      function() {}
    );

    kameraAcik = true;
    el("durum").textContent = "Ön kamera açık. QR kodu okutun.";

  } catch (err1) {
    try {
      if (scanner) {
        await scanner.clear();
      }
    } catch (e) {}

    try {
      scanner = new Html5Qrcode("reader");

      await scanner.start(
        { facingMode: "environment" },
        config,
        qrOkundu,
        function() {}
      );

      kameraAcik = true;
      el("durum").textContent = "Arka kamera açık. QR kodu okutun.";

    } catch (err2) {
      try {
        await kamerayiListeyleBaslat(config);
        kameraAcik = true;
        el("durum").textContent = "Kamera açık. QR kodu okutun.";
      } catch (err3) {
        mesajGoster("❌ Kamera açılamadı.<br>Hata: " + escapeHtml(err3.message || err3), "kirmizi", 9000);
        arayuzuSifirla();
      }
    }
  }
}

async function kamerayiListeyleBaslat(config) {
  const cameras = await Html5Qrcode.getCameras();

  if (!cameras || cameras.length === 0) {
    throw new Error("Kamera bulunamadı.");
  }

  let sonHata = null;

  const siraliKameralar = cameras.slice().sort(function(a, b) {
    const aLabel = String(a.label || "").toLowerCase();
    const bLabel = String(b.label || "").toLowerCase();

    const aOn =
      aLabel.includes("front") ||
      aLabel.includes("user") ||
      aLabel.includes("selfie") ||
      aLabel.includes("ön") ||
      aLabel.includes("on");

    const bOn =
      bLabel.includes("front") ||
      bLabel.includes("user") ||
      bLabel.includes("selfie") ||
      bLabel.includes("ön") ||
      bLabel.includes("on");

    if (aOn && !bOn) return -1;
    if (!aOn && bOn) return 1;
    return 0;
  });

  for (let i = 0; i < siraliKameralar.length; i++) {
    try {
      if (scanner) {
        try {
          await scanner.clear();
        } catch (e) {}
      }

      scanner = new Html5Qrcode("reader");

      el("durum").textContent =
        "Kamera deneniyor: " + (siraliKameralar[i].label || ("Kamera " + (i + 1)));

      await scanner.start(
        siraliKameralar[i].id,
        config,
        qrOkundu,
        function() {}
      );

      return;

    } catch (err) {
      sonHata = err;
    }
  }

  throw sonHata || new Error("Hiçbir kamera açılamadı.");
}

async function kamerayiKapat() {
  try {
    if (scanner) {
      await scanner.stop();
    }
  } catch (e) {}

  try {
    if (scanner) {
      await scanner.clear();
    }
  } catch (e) {}

  scanner = null;
  kameraAcik = false;
  qrKilidi = false;

  popupKapat();
  arayuzuSifirla();
}

function arayuzuSifirla() {
  el("durum").textContent = "Hazır";
  el("reader").classList.add("gizli");
  el("btnBaslat").classList.remove("gizli");
  el("btnKapat").classList.add("gizli");
}

/* QR OKUNDU */
function qrOkundu(text) {
  if (qrKilidi) return;

  const id = qrMetnindenIdAl(text);

  if (!id) {
    qrKilidi = true;
    bipHata();

    popupGoster(
      '<div class="popupIcon">❌</div>' +
      '<div class="popupTitle">Geçersiz QR</div>' +
      '<div class="popupText">Bu QR kod sisteme uygun değil.</div>',
      "kirmizi",
      3000
    );

    setTimeout(function() {
      qrDevamEt();
    }, 3000);

    return;
  }

  const simdi = Date.now();

  if (id === sonQrId && simdi - sonQrZaman < 8000) {
    return;
  }

  sonQrId = id;
  sonQrZaman = simdi;
  qrKilidi = true;

  bipOkundu();

  try {
    if (scanner) {
      scanner.pause(true);
    }
  } catch (e) {}

  el("durum").textContent = "Okunan ID: " + id;

  popupYukleniyor(id);
  apiGirisYap(id, true);
}

function qrDevamEt() {
  qrKilidi = false;

  if (!scanner || !kameraAcik) {
    el("durum").textContent = "Hazır";
    return;
  }

  el("durum").textContent = "Kamera açık. Yeni QR kodu okutun.";

  try {
    scanner.resume();
  } catch (e) {}
}

/* MANUEL GİRİŞ */
function manuelGiris() {
  sesHazirla();

  const metin = String(el("manuelInput").value || "").trim();
  const id = qrMetnindenIdAl(metin);

  if (!id) {
    bipHata();

    popupGoster(
      '<div class="popupIcon">❌</div>' +
      '<div class="popupTitle">Geçersiz ID</div>' +
      '<div class="popupText">Geçerli bir ID veya QR linki girin.</div>',
      "kirmizi",
      3000
    );
    return;
  }

  el("manuelInput").value = "";
  el("durum").textContent = "Okunan ID: " + id;

  bipOkundu();
  popupYukleniyor(id);
  apiGirisYap(id, false);
}

/* APPS SCRIPT BAĞLANTISI */
function apiGirisYap(id, qrModu) {
  id = String(id || "").trim();

  if (!id) {
    bipHata();

    popupGoster(
      '<div class="popupIcon">❌</div>' +
      '<div class="popupTitle">Geçersiz ID</div>' +
      '<div class="popupText">Katılımcı ID boş.</div>',
      "kirmizi",
      3500
    );

    if (qrModu) {
      setTimeout(function() {
        qrDevamEt();
      }, 3500);
    }

    return;
  }

  let cevapGeldi = false;

  window.scannerCallback = function(res) {
    cevapGeldi = true;

    sonucYaz(res);

    if (qrModu) {
      setTimeout(function() {
        qrDevamEt();
      }, 4300);
    }
  };

  const eski = document.getElementById("jsonpScript");
  if (eski) {
    eski.remove();
  }

  const script = document.createElement("script");
  script.id = "jsonpScript";
  script.src =
    WEB_APP_URL +
    "?api=checkin&id=" +
    encodeURIComponent(id) +
    "&callback=scannerCallback&t=" +
    Date.now();

  script.async = true;

  script.onerror = function() {
    setTimeout(function() {
      if (!cevapGeldi) {
        bipHata();

        popupGoster(
          '<div class="popupIcon">❌</div>' +
          '<div class="popupTitle">Bağlantı Hatası</div>' +
          '<div class="popupText">Apps Script bağlantısı kurulamadı.</div>' +
          '<div class="popupSub">Okunan ID: ' + escapeHtml(id) + '</div>',
          "kirmizi",
          6000
        );

        if (qrModu) {
          setTimeout(function() {
            qrDevamEt();
          }, 4300);
        }
      }
    }, 1500);
  };

  document.body.appendChild(script);

  setTimeout(function() {
    if (!cevapGeldi) {
      bipHata();

      popupGoster(
        '<div class="popupIcon">⏳</div>' +
        '<div class="popupTitle">Cevap Alınamadı</div>' +
        '<div class="popupText">İşlem uzun sürdü. İnternet bağlantısını kontrol edin.</div>' +
        '<div class="popupSub">Okunan ID: ' + escapeHtml(id) + '</div>',
        "sari",
        6000
      );

      if (qrModu) {
        qrDevamEt();
      }
    }
  }, 10000);
}

/* SONUÇ YAZ */
function sonucYaz(res) {
  if (res && res.durum === "basarili") {
    bipBasarili();

    popupGoster(
      '<div class="popupIcon">✅</div>' +
      '<div class="popupTitle">HOŞ GELDİNİZ</div>' +
      '<div class="popupText">' +
      escapeHtml(res.adSoyad || "") +
      '<br>' +
      escapeHtml(res.klinik || "") +
      '</div>' +
      '<div class="popupSub">' + escapeHtml(res.girisSaati || "") + '</div>',
      "yesil",
      4000
    );

  } else if (res && res.durum === "tekrar") {
    bipHata();

    popupGoster(
      '<div class="popupIcon">⚠️</div>' +
      '<div class="popupTitle">DAHA ÖNCE GİRİŞ YAPILDI</div>' +
      '<div class="popupText">' +
      escapeHtml(res.adSoyad || "") +
      '<br>' +
      escapeHtml(res.klinik || "") +
      '</div>' +
      '<div class="popupSub">İlk giriş: ' + escapeHtml(res.girisSaati || "") + '</div>',
      "kirmizi",
      4000
    );

  } else {
    bipHata();

    popupGoster(
      '<div class="popupIcon">❌</div>' +
      '<div class="popupTitle">Giriş Yapılamadı</div>' +
      '<div class="popupText">' +
      escapeHtml((res && res.mesaj) || "Katılımcı bulunamadı.") +
      '</div>',
      "kirmizi",
      4000
    );
  }
}

/* QR METNİNDEN ID AL */
function qrMetnindenIdAl(text) {
  text = String(text || "").trim();

  try {
    if (text.indexOf("http") === 0) {
      const url = new URL(text);
      const id = url.searchParams.get("id");

      if (id) {
        return guvenliDecode(id).trim();
      }
    }
  } catch (e) {}

  if (text.indexOf("id=") > -1) {
    return guvenliDecode(text.split("id=")[1].split("&")[0]).trim();
  }

  return guvenliDecode(text).trim();
}

function guvenliDecode(value) {
  value = String(value || "");

  try {
    return decodeURIComponent(value);
  } catch (e) {
    return value;
  }
}

/* ESKİ MESAJ ALANI */
function mesajGoster(html, renk, sure) {
  const m = el("mesaj");

  if (mesajTimer) {
    clearTimeout(mesajTimer);
    mesajTimer = null;
  }

  m.style.display = "block";
  m.className = renk;
  m.innerHTML = html;

  const bekleme = typeof sure === "number" ? sure : 4500;

  if (bekleme > 0) {
    mesajTimer = setTimeout(function() {
      m.style.display = "none";
    }, bekleme);
  }
}

/* HTML GÜVENLİK */
function escapeHtml(value) {
  return String(value || "").replace(/[&<>"']/g, function(s) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[s];
  });
}
</script>

</body>
</html>
